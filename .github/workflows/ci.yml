name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/texttv-discord

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check that the bot imports
        run: python -c "import bot, texttv"

  docker-image:
    name: Build and push Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          OWNER_LC=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$OWNER_LC" >> $GITHUB_ENV

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> $GITHUB_ENV
            echo "CHANNEL_TAG=dev" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> $GITHUB_ENV
            echo "CHANNEL_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Check for changes that affect the image
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          # Första pushen till en gren saknar en tidigare commit: bygg alltid då.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -Eq '^(bot\.py|texttv\.py|requirements\.txt|Dockerfile|\.dockerignore|\.github/workflows/ci\.yml)$'; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Inga ändringar som påverkar imagen, hoppar över bygget."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ env.CHANNEL_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
